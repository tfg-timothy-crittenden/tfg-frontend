[build]
  command = "npm ci && npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://toefl-backend-ancient-brook-7139.fly.dev/api/:splat"
  status = 200

[[redirects]]
  from = "/oauth/*"
  to = "https://toefl-backend-ancient-brook-7139.fly.dev/oauth/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
